name: "Component-Level Verification (Coverage & Mutation)"

on:
  push:
    branches-ignore:
      - 'gh-pages'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shippingservice-verification:
    name: "ShippingService (Go Tests, Coverage & Gremlins)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: src/shippingservice/go.sum

      - name: Run Unit Tests & Coverage
        working-directory: src/shippingservice
        run: |
          mkdir -p reports
          go test -v -coverprofile=reports/coverage.out . | tee reports/test-results.txt
          go tool cover -func=reports/coverage.out | tee reports/coverage-summary.txt

      - name: Install Gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest

      - name: Run Mutation Testing (Gremlins)
        working-directory: src/shippingservice
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          gremlins unleash | tee reports/gremlins-report.txt

      - name: Generate ShippingService Executive HTML Report
        run: |
          python3 scripts/generate_verification_reports.py \
            --shipping-dir src/shippingservice/reports \
            --output-dir src/shippingservice/reports

      - name: Upload ShippingService Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shippingservice-verification-reports
          path: src/shippingservice/reports/

  recommendationservice-verification:
    name: "RecommendationService (Pytest, Coverage & Mutmut)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        working-directory: src/recommendationservice
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov 'mutmut<3'

      - name: Run Unit Tests & Coverage
        working-directory: src/recommendationservice
        run: |
          mkdir -p reports
          pytest --cov=. --cov-report=term-missing --cov-report=xml:reports/coverage.xml -v | tee reports/pytest-coverage.txt

      - name: Run Mutation Testing (Mutmut)
        working-directory: src/recommendationservice
        run: |
          mutmut run --paths-to-mutate=recommendation_server.py | tee reports/mutmut-run.txt || true
          mutmut results | tee reports/mutmut-results.txt

      - name: Generate RecommendationService Executive HTML Report
        run: |
          python3 scripts/generate_verification_reports.py \
            --recommendation-dir src/recommendationservice/reports \
            --output-dir src/recommendationservice/reports

      - name: Upload RecommendationService Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recommendationservice-verification-reports
          path: src/recommendationservice/reports/

  executive-summary-report:
    name: "Consolidated Executive HTML Report"
    runs-on: ubuntu-24.04
    needs:
      - shippingservice-verification
      - recommendationservice-verification
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download ShippingService Reports
        uses: actions/download-artifact@v8
        with:
          name: shippingservice-verification-reports
          path: tmp-reports/shippingservice

      - name: Download RecommendationService Reports
        uses: actions/download-artifact@v8
        with:
          name: recommendationservice-verification-reports
          path: tmp-reports/recommendationservice

      - name: Generate Consolidated Executive Report
        run: |
          python3 scripts/generate_verification_reports.py \
            --shipping-dir tmp-reports/shippingservice \
            --recommendation-dir tmp-reports/recommendationservice \
            --output-dir tmp-reports/executive

      - name: Upload Consolidated Executive Report
        uses: actions/upload-artifact@v7
        with:
          name: executive-verification-report
          path: tmp-reports/executive/executive-verification-report.html
