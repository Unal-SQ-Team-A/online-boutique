name: Checkout service quality

on:
  push:
    paths:
      - "src/checkoutservice/**"
      - "test/checkoutservice/**"
      - "test/compose.yaml"
      - ".github/workflows/checkoutservice-quality.yml"
  pull_request:
    paths:
      - "src/checkoutservice/**"
      - "test/checkoutservice/**"
      - "test/compose.yaml"
      - ".github/workflows/checkoutservice-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkoutservice-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests and collect coverage
        run: docker compose -f test/compose.yaml run --rm checkoutservice-tests

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkoutservice-coverage
          path: test/checkoutservice/checkoutservice-coverage.out
          if-no-files-found: warn

  checkoutservice-mutation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run mutation tests
        run: docker compose -f test/compose.yaml run --rm checkoutservice-mutation
